<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Gradient play button on a dark rounded-square app icon">
  <defs>
    <!-- Brushed charcoal tile, gently lit from the upper-left. -->
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#505359"/>
      <stop offset="0.43" stop-color="#3b3d43"/>
      <stop offset="1" stop-color="#29292d"/>
    </linearGradient>
    <radialGradient id="upperLight" cx="0.19" cy="0.08" r="0.99">
      <stop offset="0" stop-color="#777a83" stop-opacity=".17"/>
      <stop offset="0.56" stop-color="#51545b" stop-opacity=".05"/>
      <stop offset="1" stop-color="#1e1f24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#989ba1" stop-opacity=".85"/>
      <stop offset="0.33" stop-color="#6d7077" stop-opacity=".65"/>
      <stop offset="0.72" stop-color="#48494f" stop-opacity=".8"/>
      <stop offset="1" stop-color="#77787e" stop-opacity=".57"/>
    </linearGradient>
    <linearGradient id="playColors" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7736"/>
      <stop offset="0.28" stop-color="#ff615b"/>
      <stop offset="0.56" stop-color="#9c70b4"/>
      <stop offset="0.80" stop-color="#4976e9"/>
      <stop offset="1" stop-color="#2585ff"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="0.98" cy="0.49" r="0.81" fx="0.98" fy="0.49">
      <stop offset="0" stop-color="#19c6ff" stop-opacity="1"/>
      <stop offset="0.33" stop-color="#2baeff" stop-opacity=".95"/>
      <stop offset="0.67" stop-color="#2c8cf4" stop-opacity=".26"/>
      <stop offset="1" stop-color="#2c8cf4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="playEdge" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".30"/>
      <stop offset="0.60" stop-color="#ffffff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#acd8ff" stop-opacity=".10"/>
    </linearGradient>
    <filter id="tileShadow" x="-15%" y="-15%" width="130%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15" result="blur"/>
      <feOffset in="blur" dy="18" result="offset"/>
      <feComponentTransfer in="offset" result="shadowAlpha">
        <feFuncA type="linear" slope="0.26"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadowAlpha"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="playShadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="blur"/>
      <feOffset in="blur" dy="11" result="offset"/>
      <feComponentTransfer in="offset" result="shadowAlpha">
        <feFuncA type="linear" slope="0.34"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadowAlpha"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <path id="playShape" d="M 362 330 C 362 300 386 283 412 296 L 727 473 C 755 488 755 515 727 533 L 416 714 C 386 732 362 714 362 681 Z"/>
    <clipPath id="playClip"><use href="#playShape"/></clipPath>
  </defs>

  <!-- Transparent canvas: the reference image's checkerboard is not included. -->
  <g filter="url(#tileShadow)">
    <rect x="81" y="81" width="862" height="862" rx="216" fill="url(#tile)"/>
    <rect x="81" y="81" width="862" height="862" rx="216" fill="url(#upperLight)"/>
    <rect x="83.5" y="83.5" width="857" height="857" rx="213.5" fill="none" stroke="url(#rim)" stroke-width="5"/>
    <rect x="88.5" y="88.5" width="847" height="847" rx="209" fill="none" stroke="#ffffff" stroke-opacity=".055" stroke-width="2"/>
  </g>

  <g filter="url(#playShadow)">
    <use href="#playShape" fill="url(#playColors)"/>
    <g clip-path="url(#playClip)">
      <rect x="360" y="278" width="404" height="458" fill="url(#cyanGlow)"/>
    </g>
    <use href="#playShape" fill="none" stroke="url(#playEdge)" stroke-width="3" stroke-linejoin="round"/>
  </g>
</svg>
